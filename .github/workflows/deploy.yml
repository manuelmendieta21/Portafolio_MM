name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [ "main" ]  # Cambia "main" por tu rama principal si es diferente
  workflow_dispatch:     # Permite ejecutar el flujo manualmente desde la pestaña Actions

# Permisos necesarios para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo una ejecución concurrente del despliegue
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'  # Usa Node.js 22 (LTS) o la versión que prefieras
          cache: 'npm'        # Cambia a 'yarn' o 'pnpm' si usas otro gestor

      - name: Install dependencies
        run: npm ci           # O 'yarn install' o 'pnpm install'

      - name: Build your Astro project
        run: npm run build    # O 'yarn build' o 'pnpm run build'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist        # Ruta a la carpeta de salida de Astro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
