name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [ "main" ]  # O la rama que uses como principal
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # O la versión que uses
          cache: 'npm'     # Puede ser 'yarn' o 'pnpm' si usas otro gestor

      - name: Install dependencies
        run: npm ci        # O 'yarn install' o 'pnpm install'

      - name: Build your Astro project
        run: npm run build # O 'yarn build' o 'pnpm run build'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist     # La carpeta de salida por defecto de Astro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
